<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blinkit Login Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
       <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .login-box {
            max-width: 400px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            background-color: #f7d900;
            color: #111;
            font-size: 35px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
        }

        .btn-blinkit {
            background-color: #f7d900;
            color: #111;
            font-weight: bold;
            border: none;
        }

        .btn-blinkit:hover {
            background-color: #e5c900;
        }

        .form-control {
            padding: 12px;
        }
    </style>
</head>

<body>

    <div class="container min-vh-100 d-flex
                justify-content-center align-items-center">

        <div class="login-box p-4">

            <div class="logo text-center mb-4">
                blinkit
            </div>

            <h3 class="text-center fw-bold">
                Login / Sign Up
            </h3>

            <p class="text-center text-secondary">
                Enter your mobile number to continue
            </p>

            <form>
                <label for="mobile" class="form-label">
                    Mobile Number
                </label>

                <div class="input-group mb-3">
                    <span class="input-group-text">+91</span>

                    <input type="tel" id="mobile" class="form-control" placeholder="Enter 10-digit number"
                        pattern="[0-9]{10}" maxlength="10" required>
                </div>

                <button type="submit" class="btn btn-blinkit w-100 py-2">
                    Continue
                </button>
            </form>

            <p class="text-center text-secondary small mt-4 mb-0">
                By continuing, you agree to our
                <a href="#" class="text-dark">Terms</a> and
                <a href="#" class="text-dark">Privacy Policy</a>.
            </p>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
